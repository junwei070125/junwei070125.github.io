<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Light the Void 2D 網頁遊戲" />
    <title>Light the Void</title>
    <link rel="stylesheet" href="./CSS/game.css" />
  </head>
  <body>
    <main class="game-page">
      <section class="game-frame" aria-label="遊戲畫面">
        <div class="game-shell">
          <canvas
            id="game-canvas"
            width="1280"
            height="720"
            aria-label="Light the Void 遊戲畫布"
          ></canvas>
          <img id="game-character" class="game-character" alt="" hidden />
          <div class="damage-vignette" id="damage-vignette" aria-hidden="true">
            <span></span>
          </div>
          <div
            class="critical-health-vignette"
            id="critical-health-vignette"
            aria-hidden="true"
          >
            <span></span>
          </div>
          <div class="ending-interaction" id="ending-interaction" hidden>
            <button
              class="ending-character-button"
              id="character-button"
              type="button"
              aria-label="與主任對話"
              aria-controls="ending-dialogue-panel"
              aria-expanded="false"
            >
              <img
                src="./image/game/character/character-3.png"
                alt=""
                data-asset-label="主任 character-3.png"
              />
              <span>!</span>
            </button>
            <section
              class="ending-dialogue-scene"
              id="ending-dialogue-scene"
              hidden
            >
              <div
                class="ending-portrait"
                id="ending-portrait-a"
                aria-hidden="true"
              >
                <img
                  src="./image/game/character/character-1.gif"
                  alt=""
                  data-asset-label="旅人立繪 character-1.gif"
                />
              </div>
              <div
                class="ending-portrait"
                id="ending-portrait-b"
                aria-hidden="true"
              >
                <img
                  src="./image/game/character/character-3.png"
                  alt=""
                  data-asset-label="主任立繪 character-3.png"
                />
              </div>
              <button
                class="ending-dialogue-panel"
                id="ending-dialogue-panel"
                type="button"
                aria-live="polite"
                aria-label="結局對話，點擊繼續"
              >
                <span
                  class="ending-dialogue-speaker"
                  id="ending-speaker"
                ></span>
                <span id="ending-dialogue" class="ending-dialogue"></span>
                <span
                  class="ending-dialogue-continue"
                  id="ending-continue"
                  hidden
                >
                  繼續 <span aria-hidden="true">▼</span>
                </span>
              </button>
              <button
                class="ending-dialogue-finish"
                id="ending-finish-button"
                type="button"
                hidden
              >
                <!-- 按鈕文字可修改：結束對話 -->
                <span>查看分數</span>
              </button>
            </section>
          </div>

          <div class="hud" aria-live="polite">
            <div
              class="hud__health"
              id="health-display"
              aria-label="生命值"
            ></div>
            <div class="hud__stats">
              <span class="hud__score" id="score-display">✦ 196</span>
              <span class="hud__combo" id="combo-display">COMBO 0</span>
            </div>
            <button
              class="image-button menu-button"
              id="pause-button"
              type="button"
              aria-label="暫停遊戲"
              title="暫停遊戲"
            >
              <img
                src="./image/game/icon/menu.png"
                alt=""
                data-asset-label="選單按鈕 menu.png"
              />
            </button>
          </div>

          <div
            class="collection-alert"
            id="collection-alert"
            aria-hidden="true"
            hidden
          >
            <span class="collection-alert__marker" data-corner="topLeft"
              >!</span
            >
            <span class="collection-alert__marker" data-corner="topRight"
              >!</span
            >
            <span class="collection-alert__marker" data-corner="bottomLeft"
              >!</span
            >
            <span class="collection-alert__marker" data-corner="bottomRight"
              >!</span
            >
          </div>

          <aside class="developer-panel" id="developer-panel" hidden>
            <label>
              畫面縮放
              <input
                id="developer-scale"
                type="range"
                min="0.5"
                max="1.5"
                step="0.05"
                value="1"
              />
            </label>
            <label>
              背景位置
              <input
                id="developer-scroll"
                type="range"
                min="0"
                max="41728"
                step="100"
                value="0"
              />
            </label>
            <output id="developer-position">0 px</output>
          </aside>

          <section class="overlay overlay--intro" id="intro-overlay">
            <div class="dialog-card intro-card">
              <img
                class="instruction-art"
                src="./image/game/screen/howtoplay.gif"
                alt="玩法介紹"
                data-asset-label="玩法介紹圖 howtoplay.gif"
              />
              <div class="fallback-instructions">
                <h1 class="eyebrow">HOW TO PLAY</h1>
                <p class="carefull">
                  小心異常，他會奪走你的<span class="carefull__health"
                    >生命值</span
                  >
                </p>
              </div>
              <div class="instruction-hints">
                <p class="instruction-hints__left">點擊異常以除掉他們!</p>
                <p class="instruction-hints__right">移動滑鼠旋轉光束!</p>
              </div>
              <button
                class="image-button action-button"
                id="start-button"
                type="button"
              >
                <!-- 按鈕文字可修改：玩法介紹頁的開始提示 -->
                <span>我知道了，開始遊戲</span>
              </button>
            </div>
          </section>

          <section class="overlay overlay--pause" id="pause-overlay" hidden>
            <div class="dialog-card pause-card">
              <img
                class="menu-art"
                src="./image/game/screen/menubg.gif"
                alt=""
                data-asset-label="暫停選單背景 menubg.gif"
              />
              <p class="eyebrow">PAUSED</p>
              <h2>暫停</h2>
              <button
                class="image-button action-button"
                id="home-button"
                type="button"
              >
                <!-- 按鈕文字可修改：返回主畫面 -->
                <span>返回主畫面</span>
              </button>
              <button
                class="image-button action-button"
                id="resume-button"
                type="button"
              >
                <!-- 按鈕文字可修改：繼續遊戲 -->
                <span>繼續遊戲</span>
              </button>
            </div>
          </section>

          <section class="overlay" id="failure-overlay" hidden>
            <div class="dialog-card">
              <p class="eyebrow">GAME OVER</p>
              <h2>光芒消逝了</h2>
              <p>本次得分：<strong id="failure-score">196</strong></p>
              <button
                class="image-button action-button"
                id="retry-button"
                type="button"
              >
                <!-- 按鈕文字可修改：重新開始 -->
                <span>重新開始</span>
              </button>
              <button class="text-button" data-go-home type="button">
                <!-- 按鈕文字可修改：返回主畫面 -->
                <span>返回主畫面</span>
              </button>
            </div>
          </section>

          <section
            class="overlay overlay--result"
            id="result-overlay"
            aria-label="結算畫面"
            hidden
          >
            <div class="result-card">
              <img
                class="result-art"
                src="./image/game/screen/result.png"
                alt=""
                data-asset-label="結算布告欄背景 result-1.png"
              />
              <dl class="result-list" aria-label="本次結算分數">
                <div class="result-player">
                  <dd id="result-traveler-name">旅人</dd>
                </div>
                <div>
                  <dt>原始薪水</dt>
                  <dd id="result-base-score">196</dd>
                </div>
                <div>
                  <dt>最高 Combo</dt>
                  <dd id="result-max-combo">0</dd>
                </div>
                <div>
                  <dt>Combo 額外加薪</dt>
                  <dd id="result-bonus">0</dd>
                </div>
                <div class="result-total">
                  <dt>最終總薪</dt>
                  <dd id="result-total">196</dd>
                </div>
              </dl>
              <div class="result-actions">
                <button
                  class="image-button action-button"
                  id="result-retry-button"
                  type="button"
                >
                  <!-- 按鈕文字可修改：再玩一次 -->
                  <span>再玩一次</span>
                </button>
                <button class="text-button" data-go-home type="button">
                  <!-- 按鈕文字可修改：返回主畫面 -->
                  <span>返回主畫面</span>
                </button>
              </div>
            </div>
          </section>

          <!-- 可直接修改下方文字，調整遊戲畫面底部的操作提示。 -->
          <p class="game-instruction">
            移動滑鼠照亮前方，點擊光束中的物件收集它們。
          </p>
        </div>
      </section>
    </main>
    <audio
      id="game-bgm"
      src="./audio/gameBGM.mp3"
      preload="auto"
      loop
      aria-hidden="true"
    ></audio>
    <script src="./JS/audio.js" defer></script>
    <script src="./JS/game.js" defer></script>
  </body>
</html>
