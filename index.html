<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Light the Void 遊戲首頁" />
    <title>Light the Void</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./CSS/home.css" />
  </head>
  <body>
    <main class="home" aria-label="Light the Void 遊戲首頁">
      <!-- 視差背景：將對應 PNG 放進 images/background 資料夾。 (由遠到近)-->
      <div class="parallax" aria-hidden="true">
        <div class="parallax__layer parallax__layer--1"></div>
        <div class="parallax__layer parallax__layer--2"></div>
        <div class="parallax__layer parallax__layer--3 hide"></div>
        <div class="parallax__layer parallax__layer--4"></div>
      </div>

      <div class="particle" aria-hidden="true"></div>
      <div class="cursor-glow" aria-hidden="true"></div>

      <!-- 置中的圖片式遊戲入口；圖片請放在 images/start-button.png。 -->
      <section class="home__content hide">
        <a class="play-button" href="./intro.html" aria-label="開始遊戲">
          <img
            class="play-button__image"
            src="./image/home/START.png"
            alt="開始遊戲"
          />
        </a>
      </section>

      <img
        class="home-overlay"
        src="./image/home/layer-4.gif"
        alt=""
        aria-hidden="true"
      />

      <button
        class="music-toggle"
        id="music-toggle"
        type="button"
        aria-label="開啟音樂"
        aria-pressed="false"
      >
        <img src="./image/game/icon/off.png" alt="" />
      </button>
    </main>
    <audio id="home-bgm" src="./audio/indexBGM.mp3" preload="auto" loop></audio>
    <script src="./JS/audio.js" defer></script>
    <script src="./JS/home.js" defer></script>
  </body>
</html>
