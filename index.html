<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Light the Void 遊戲首頁" />
    <title>Light the Void</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./CSS/home.css" />
  </head>
  <body>
    <main class="home" aria-label="Light the Void 遊戲首頁">
      <!-- 視差背景：將對應 PNG 放進 images/background 資料夾。 (由遠到近)-->
      <div class="parallax" aria-hidden="true">
        <div class="parallax__layer parallax__layer--1"></div>
        <div class="parallax__layer parallax__layer--2"></div>
        <div class="parallax__layer parallax__layer--3"></div>
        <div class="parallax__layer parallax__layer--4"></div>
        <div class="parallax__layer parallax__layer--5"></div>
        <div class="parallax__layer parallax__layer--6"></div>
        <div class="parallax__layer parallax__layer--7"></div>
      </div>

      <div class="particle" aria-hidden="true"></div>

      <!-- 置中的圖片式遊戲入口；圖片請放在 images/start-button.png。 -->
      <section class="home__content">
        <a class="play-button" href="./game.html" aria-label="開始遊戲">
          <img
            class="play-button__image"
            src="./image/logo.png"
            alt="開始遊戲"
          />
        </a>
        <p class="home__instruction">點擊標題進入遊戲。</p>
      </section>
    </main>
    <script src="./JS/home.js" defer></script>
  </body>
</html>
